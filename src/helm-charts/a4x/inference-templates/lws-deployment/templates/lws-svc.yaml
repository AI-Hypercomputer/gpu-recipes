apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-svc
  namespace: default
  labels:
    app: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    leaderworkerset.sigs.k8s.io/name: {{ .Release.Name }}
    leaderworkerset.sigs.k8s.io/worker-index: "0"
