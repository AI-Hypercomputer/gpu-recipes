{{- $routerEnabled := .Values.llmd.router.enabled -}}
{{- if hasKey .Values "router" -}}
  {{- if hasKey .Values.router "enabled" -}}
    {{- $routerEnabled = .Values.router.enabled -}}
  {{- end -}}
{{- end -}}
{{- $ns := .Release.Namespace -}}
{{- $saCreate := true -}}
{{- $saName := printf "%s-router-sa" .Release.Name -}}
{{- if hasKey .Values.llmd.router "serviceAccount" -}}
  {{- if hasKey .Values.llmd.router.serviceAccount "create" -}}
    {{- $saCreate = .Values.llmd.router.serviceAccount.create -}}
  {{- end -}}
  {{- if .Values.llmd.router.serviceAccount.name -}}
    {{- $saName = .Values.llmd.router.serviceAccount.name -}}
  {{- else if not $saCreate -}}
    {{- $saName = "default" -}}
  {{- end -}}
{{- end -}}
{{- if .Values.llmd.router.serviceAccountName -}}
  {{- $saName = .Values.llmd.router.serviceAccountName -}}
{{- end -}}
{{- if $routerEnabled }}
{{- if $saCreate }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: llm-d-inference
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: router
---
{{- end }}
{{- if and .Values.llmd.router.rbac .Values.llmd.router.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ .Release.Name }}-k8s-discovery"
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: llm-d-inference
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: router
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ .Release.Name }}-k8s-discovery-binding"
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: llm-d-inference
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: router
subjects:
- kind: ServiceAccount
  name: {{ $saName }}
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ .Release.Name }}-k8s-discovery"
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-router"
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: llm-d-inference
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: router
spec:
  replicas: {{ .Values.llmd.router.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-d-inference
      app.kubernetes.io/instance: "{{ .Release.Name }}"
      app.kubernetes.io/component: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d-inference
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: router
    spec:
      automountServiceAccountToken: true
      serviceAccountName: {{ $saName }}
      {{- with .Values.llmd.router.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.llmd.router.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
      - name: envoy-proxy
        image: {{ .Values.llmd.router.envoyImage }}
        imagePullPolicy: IfNotPresent
        command: ["envoy"]
        args:
        - "--service-node"
        - "envoy-proxy"
        - "--log-level"
        - "warn"
        - "-c"
        - "/etc/envoy/envoy.yaml"
        ports:
        - name: http-8081
          containerPort: {{ .Values.service.ports.envoyHttp | default 8081 }}
          protocol: TCP
        - name: ready-19001
          containerPort: 19001
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /ready
            port: 19001
            scheme: HTTP
          periodSeconds: 5
          timeoutSeconds: 1
        resources:
{{ toYaml .Values.llmd.router.resources.envoy | indent 10 }}
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
          readOnly: true
      - name: router
        image: {{ .Values.llmd.router.eppImage }}
        imagePullPolicy: IfNotPresent
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        ports:
        - name: grpc
          containerPort: {{ .Values.service.ports.eppGrpc | default 9002 }}
          protocol: TCP
        - name: grpc-health
          containerPort: 9003
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.service.ports.eppMetrics | default 9090 }}
          protocol: TCP
        args:
        - "--endpoint-selector={{ .Values.llmd.router.endpointSelector | default (printf "app.kubernetes.io/instance=%s,app.kubernetes.io/name=llm-d-inference,app.kubernetes.io/component=model-server" .Release.Name) }}"
        - "--endpoint-target-ports={{ .Values.service.ports.vllmHttp | default 8000 }}"
        - "--config-file=/etc/epp/plugins-config.yaml"
        - "--grpc-health-port=9003"
        - "--tracing=false"
        - "--metrics-endpoint-auth=false"
        - "--allow-experimental-plugins=true"
        readinessProbe:
          grpc:
            port: 9003
            service: inference-extension
          periodSeconds: 5
          timeoutSeconds: 1
        resources:
{{ toYaml .Values.llmd.router.resources.epp | indent 10 }}
        volumeMounts:
        - name: epp-config
          mountPath: /etc/epp
          readOnly: true
      volumes:
      - name: envoy-config
        configMap:
          name: "{{ .Release.Name }}-envoy-config"
      - name: epp-config
        configMap:
          name: "{{ .Release.Name }}-epp-config"
{{- end }}
