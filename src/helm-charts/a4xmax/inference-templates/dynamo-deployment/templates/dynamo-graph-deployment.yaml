apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: {{ .Values.dynamo.deploymentName }}
  namespace: {{ .Values.dynamo.namespace }}
spec:
  {{- if .Values.workload.framework }}
  backendFramework: {{ .Values.workload.framework }}
  {{- end }}
  services:
    Frontend:
      dynamoNamespace: {{ .Values.dynamo.namespace }}
      runtimeVersionOverride: {{ .Values.dynamo.releaseVersion | default "1.0.1" | quote }}
      componentType: frontend
      replicas: {{ .Values.dynamo.frontend.replicas }}
      {{- if .Values.dynamo.frontend.envs }}
      envs:
      {{- toYaml .Values.dynamo.frontend.envs | nindent 8 }}
      {{- end }}
      {{- if .Values.dynamo.frontend.livenessProbe }}
      livenessProbe:
        httpGet:
          path: /live
          port: 8000
        initialDelaySeconds: {{ .Values.dynamo.frontend.livenessProbe.initialDelaySeconds }}
        periodSeconds: {{ .Values.dynamo.frontend.livenessProbe.periodSeconds }}
        timeoutSeconds: {{ .Values.dynamo.frontend.livenessProbe.timeoutSeconds }}
        failureThreshold: {{ .Values.dynamo.frontend.livenessProbe.failureThreshold }}
      {{- end }}
      {{- if .Values.dynamo.frontend.readinessProbe }}
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: {{ .Values.dynamo.frontend.readinessProbe.initialDelaySeconds }}
        periodSeconds: {{ .Values.dynamo.frontend.readinessProbe.periodSeconds }}
        timeoutSeconds: {{ .Values.dynamo.frontend.readinessProbe.timeoutSeconds }}
        failureThreshold: {{ .Values.dynamo.frontend.readinessProbe.failureThreshold }}
      {{- end }}
      resources:
        requests:
          cpu: "16"
          memory: "50Gi"
        limits:
          cpu: "16"
          memory: "50Gi"
      extraPodMetadata:
        annotations:
          {{- if eq .Values.volumes.useGcs true }}
          gke-gcsfuse/volumes: "true"
          gke-gcsfuse/cpu-limit: "0"
          gke-gcsfuse/memory-limit: "0"
          gke-gcsfuse/ephemeral-storage-limit: "0"
          gke-gcsfuse/file-cache-capacity: "500Gi"
          gke-gcsfuse/cache-path: "/gcs-cache"
          {{- end }}
      extraPodSpec:
        automountServiceAccountToken: true
        {{- if .Values.dynamo.serviceAccountName }}
        serviceAccountName: {{ .Values.dynamo.serviceAccountName }}
        {{- end }}
        nodeSelector:
          kubernetes.io/arch: arm64
          {{- with .Values.dynamo.nodeSelector }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        tolerations:
        - key: "kubernetes.io/arch"
          operator: "Equal"
          value: "arm64"
          effect: "NoSchedule"
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
        volumes:
        - name: local-ssd
          hostPath:
            path: /mnt/disks/gke-local-ssd/gcsfuse-cache
            type: DirectoryOrCreate
        {{- if eq .Values.volumes.useGcs true }}
        - name: gcs-model-volume
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: {{ .Values.volumes.gcsfuse.bucketName }}
              mountOptions: "implicit-dirs,file-cache:enable-parallel-downloads:true,file-cache:parallel-downloads-per-file:100,file-cache:max-parallel-downloads:-1,file-cache:download-chunk-size-mb:50,file-cache:max-size-mb:-1"
        {{- end }}
        mainContainer:
          securityContext:
            privileged: true
            runAsUser: 0
          image: {{ .Values.dynamo.frontend.image }}
          {{- if eq .Values.volumes.useGcs true }}
          volumeMounts:
          - name: local-ssd
            mountPath: /gcs-cache
          - name: gcs-model-volume
            mountPath: /data/model
            readOnly: true
          {{- end }}
          resources:
            requests:
              ephemeral-storage: "30Gi"
            limits:
              ephemeral-storage: "30Gi"

    Decode:
      {{- if gt (int .Values.dynamo.decodeWorker.nodeCount) 1 }}
      multinode:
        nodeCount:  {{ .Values.dynamo.decodeWorker.nodeCount }}
      {{- end }}
      dynamoNamespace: {{ .Values.dynamo.namespace }}
      runtimeVersionOverride: {{ .Values.dynamo.releaseVersion | default "1.0.1" | quote }}
      envFromSecret: {{ .Values.secrets.huggingface.secretName }}
      componentType: worker
      {{- if gt (int .Values.dynamo.prefillWorker.replicas) 0 }}
      subComponentType: decode
      {{- end }}
      replicas: {{ .Values.dynamo.decodeWorker.replicas }}
      livenessProbe:
        httpGet:
          path: /live
          port: system
        initialDelaySeconds: {{ .Values.dynamo.decodeWorker.livenessProbe.initialDelaySeconds }} 
        periodSeconds: {{ .Values.dynamo.decodeWorker.livenessProbe.periodSeconds }}        
        timeoutSeconds: {{ .Values.dynamo.decodeWorker.livenessProbe.timeoutSeconds }}        
        failureThreshold: {{ .Values.dynamo.decodeWorker.livenessProbe.failureThreshold }}
      readinessProbe:
        httpGet:
          path: /health
          port: system
        initialDelaySeconds: {{ .Values.dynamo.decodeWorker.readinessProbe.initialDelaySeconds }}
        timeoutSeconds: {{ .Values.dynamo.decodeWorker.readinessProbe.timeoutSeconds }}
        periodSeconds: {{ .Values.dynamo.decodeWorker.readinessProbe.periodSeconds }}
        failureThreshold: {{ .Values.dynamo.decodeWorker.readinessProbe.failureThreshold }}
      sharedMemory:
        size: 80Gi
      resources:
        limits:
          gpu: "4"
        claims:
          - name: compute-domain-channel
          {{- if (.Values.dynamo.rdma).claimTemplateName }}
          - name: rdma
          {{- end }}
      envs:
        - name: SERVER_ARGS_FILE
          value: {{ .Values.workload.configPath }}/{{ .Values.workload.configFile }}
        {{- if eq .Values.volumes.useGcs true }}
        - name: MODEL_PATH
          value: {{ .Values.workload.modelPath | default (printf "%s/%s" .Values.volumes.gcsMounts.mountPath .Values.workload.model) }}
        {{- end }}
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        {{- if .Values.dynamo.decodeWorker.envs }}
        {{- toYaml .Values.dynamo.decodeWorker.envs | nindent 8 }}
        {{- end }}
      extraPodMetadata:
        annotations:
          {{- if eq .Values.volumes.useGcs true }}
          gke-gcsfuse/cpu-limit: "0"
          gke-gcsfuse/ephemeral-storage-limit: "0"
          gke-gcsfuse/memory-limit: "0"
          gke-gcsfuse/volumes: "true"
          {{- end }}
      extraPodSpec:
        {{- if not (.Values.dynamo.rdma).claimTemplateName }}
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        {{- end }}
        automountServiceAccountToken: true
        {{- if .Values.dynamo.serviceAccountName }}
        serviceAccountName: {{ .Values.dynamo.serviceAccountName }}
        {{- end }}
        resourceClaims:
          - name: compute-domain-channel
            resourceClaimTemplateName: {{ .Values.dynamo.computeDomain.resourceClaimTemplateName }}
          {{- if (.Values.dynamo.rdma).claimTemplateName }}
          - name: rdma
            resourceClaimTemplateName: {{ .Values.dynamo.rdma.claimTemplateName }}
          {{- end }}
        tolerations:
          - key: "kubernetes.io/arch"
            operator: "Equal"
            value: "arm64"
            effect: "NoSchedule"
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                  - arm64
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: nvidia.com/dynamo-component-type
                        operator: In
                        values: ["worker"]
                  topologyKey: cloud.google.com/gce-topology-subblock
        nodeSelector:
          cloud.google.com/gke-accelerator: nvidia-gb300
          cloud.google.com/gke-gpu: "true"
          kubernetes.io/arch: arm64
          {{- with .Values.dynamo.nodeSelector }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        mainContainer:
          securityContext:
            privileged: true
            runAsUser: 0
            capabilities:
              add: ["IPC_LOCK"]
          image: {{ .Values.workload.image }}
          workingDir: /tmp
          startupProbe:
            failureThreshold: {{ .Values.dynamo.decodeWorker.startupProbe.failureThreshold }}
            httpGet:
              path: /live
              port: system
            periodSeconds: {{ .Values.dynamo.decodeWorker.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.dynamo.decodeWorker.startupProbe.timeoutSeconds }}
            initialDelaySeconds: {{ .Values.dynamo.decodeWorker.startupProbe.initialDelaySeconds }}
          command: ["/bin/bash", "-c"]
          stdin: true
          tty: true
          args:
          - |
            set -e
            echo "precedence ::ffff:0:0/96  100" >> /etc/gai.conf 2>/dev/null || true
            nvidia-smi
            export TRITON_PTXAS_PATH=/usr/local/cuda/bin/ptxas
            echo "Using ptxas: $TRITON_PTXAS_PATH"
            [ -f /usr/local/gib/scripts/set_nccl_env.sh ] && . /usr/local/gib/scripts/set_nccl_env.sh || true
            export NCCL_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME:-eth0}
            export NCCL_IB_DISABLE=${NCCL_IB_DISABLE:-1}
            export NCCL_CROSS_NIC=${NCCL_CROSS_NIC:-1}
            export NCCL_NET_GDR_LEVEL=${NCCL_NET_GDR_LEVEL:-PIX}
            export GLOO_SOCKET_IFNAME=${GLOO_SOCKET_IFNAME:-eth0}
            export TP_SOCKET_IFNAME=${TP_SOCKET_IFNAME:-eth0}
            export NCCL_DEBUG=${NCCL_DEBUG:-INFO}
            export SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE=${SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE:-100000}
            export SGLANG_DISAGGREGATION_HEARTBEAT_INTERVAL=${SGLANG_DISAGGREGATION_HEARTBEAT_INTERVAL:-10.0}
            export SGLANG_DISAGGREGATION_QUEUE_SIZE=${SGLANG_DISAGGREGATION_QUEUE_SIZE:-1024}
            export SGLANG_DISAGGREGATION_THREAD_POOL_SIZE=${SGLANG_DISAGGREGATION_THREAD_POOL_SIZE:-1024}
            export SGLANG_MOONCAKE_CUSTOM_MEM_POOL=${SGLANG_MOONCAKE_CUSTOM_MEM_POOL:-NVLINK}
            export MOONCAKE_PROTOCOL=${MOONCAKE_PROTOCOL:-tcp}
            if [ "${MC_FORCE_MNNVL:-}" = "0" ] || [ "${MC_FORCE_MNNVL:-}" = "false" ]; then
              unset MC_FORCE_MNNVL
            fi

            echo "--- VERIFYING NCCL ENV VARS IN SHELL ---"
            env | grep NCCL_
            echo "--- END VERIFICATION ---"
            pip install hf_transfer --break-system-packages || true
            # Repro fix: SGLang f7473673dd replaced ServerArgs.get_model_config()
            # with sglang.srt.server_args.model_config_of(); ai-dynamo 1.5.1 still
            # calls the old method. Patch only when the old method is missing.
            if ! python3 -c "from sglang.srt.server_args import ServerArgs; assert hasattr(ServerArgs, 'get_model_config')" 2>/dev/null; then
              DYN_ARGS_PY=$(python3 -c "import importlib.util; spec = importlib.util.find_spec('dynamo.sglang.args'); print(spec.origin if spec and spec.origin else '')" 2>/dev/null || true)
              if [ -n "$DYN_ARGS_PY" ] && [ -f "$DYN_ARGS_PY" ]; then
                sed -i 's/server_args\.get_model_config()\.is_multimodal/__import__("sglang.srt.server_args", fromlist=["model_config_of"]).model_config_of(server_args).is_multimodal/' "$DYN_ARGS_PY"
                echo "Patched $DYN_ARGS_PY for model_config_of"; grep -n "model_config_of" "$DYN_ARGS_PY" || true
              else
                echo "Warning: dynamo.sglang.args not found, skipping model_config_of patch"
              fi
            fi

            ARGS=()
            if [ -n "$MODEL_PATH" ]; then
              echo "Adding model path from env var: $MODEL_PATH"
              ARGS+=("--model-path" "$MODEL_PATH")
            else
              echo "No MODEL_PATH env var set from gcsfuse, relying on config file for model"
              ARGS+=("--model" "{{ .Values.workload.model }}")
            fi
            if [ -f "$SERVER_ARGS_FILE" ]; then
              echo "Loading server arguments from ConfigMap"
              while IFS=': ' read -r key value || [ -n "$key" ]; do
                [[ -z "$key" || "$key" == \#* ]] && continue
                key=$(echo "$key" | xargs)
                value=$(echo "$value" | sed -e 's/^[[:space:]'\''"]*//' -e 's/[[:space:]'\''"]*$//')

                if [ -n "$key" ]; then
                  if [[ "$value" == "true" ]]; then
                    ARGS+=("--$key")
                  elif [[ "$value" == "false" ]]; then
                    :
                  elif [ -n "$value" ]; then
                    if [[ "$value" =~ ^\[.*\]$ ]]; then
                      clean_value=$(echo "$value" | tr -d '[],')
                      ARGS+=("--$key")
                      for val in $clean_value; do
                        ARGS+=("$val")
                      done
                    else
                      ARGS+=("--$key" "$value")
                    fi
                  else
                    ARGS+=("--$key")
                  fi
                fi
              done < "$SERVER_ARGS_FILE"
            fi

            echo "Running: python3 -m dynamo.sglang ${ARGS[@]}"
            exec python3 -m dynamo.sglang "${ARGS[@]}"

          volumeMounts:
          {{- if eq .Values.volumes.useGcs true }}
            - mountPath: /data/model
              name: gcs-model-volume
          {{- end }}
            - name: library-dir-host
              mountPath: /usr/local/nvidia
            - name: gib
              mountPath: /usr/local/gib
            - name: serving-configuration
              mountPath: {{ .Values.workload.configPath | default "/workload/configs" }}
        volumes:
        {{- if eq .Values.volumes.useGcs true }}
        - name: gcs-model-volume
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: {{ .Values.volumes.gcsfuse.bucketName }}
              mountOptions: implicit-dirs,file-cache:enable-parallel-downloads:true,file-cache:parallel-downloads-per-file:100,file-cache:max-parallel-downloads:-1,file-cache:download-chunk-size-mb:10,file-cache:max-size-mb:-1
              fileCachePath: "/ssd/gcsfuse-cache"
              fileCacheCapacityInBytes: "150000000000"
        {{- end }}
        - name: library-dir-host
          hostPath:
            path: /home/kubernetes/bin/nvidia
        - name: gib
          hostPath:
            path: /home/kubernetes/bin/gib
        - name: serving-configuration
          configMap:
            name: "{{ .Release.Name }}-decode-config"
            items:
            - key: serving-configuration
              path: {{ .Values.workload.configFile | default "serving-args.yaml" }}

    {{- if gt (int .Values.dynamo.prefillWorker.replicas) 0 }}
    Prefill:
      {{- if gt (int .Values.dynamo.prefillWorker.nodeCount) 1 }}
      multinode:
          nodeCount: {{ .Values.dynamo.prefillWorker.nodeCount }}
      {{- end }}
      dynamoNamespace: {{ .Values.dynamo.namespace }}
      runtimeVersionOverride: {{ .Values.dynamo.releaseVersion | default "1.0.1" | quote }}
      envFromSecret: {{ .Values.secrets.huggingface.secretName }}
      componentType: worker
      subComponentType: prefill
      replicas: {{ .Values.dynamo.prefillWorker.replicas }}
      livenessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - "exit 0"
        initialDelaySeconds: {{ .Values.dynamo.prefillWorker.livenessProbe.initialDelaySeconds }} 
        periodSeconds: {{ .Values.dynamo.prefillWorker.livenessProbe.periodSeconds }}        
        timeoutSeconds: {{ .Values.dynamo.prefillWorker.livenessProbe.timeoutSeconds }}        
        failureThreshold: {{ .Values.dynamo.prefillWorker.livenessProbe.failureThreshold }}
      readinessProbe:
        httpGet:
          path: /health
          port: system
        initialDelaySeconds: {{ .Values.dynamo.prefillWorker.readinessProbe.initialDelaySeconds }}
        timeoutSeconds: {{ .Values.dynamo.prefillWorker.readinessProbe.timeoutSeconds }}
        periodSeconds: {{ .Values.dynamo.prefillWorker.readinessProbe.periodSeconds }}
        failureThreshold: {{ .Values.dynamo.prefillWorker.readinessProbe.failureThreshold }}
      sharedMemory:
        size: 80Gi
      resources:
        limits:
          gpu: "4"
        claims:
          - name: compute-domain-channel
          {{- if (.Values.dynamo.rdma).claimTemplateName }}
          - name: rdma
          {{- end }}
      envs:
        - name: SERVER_ARGS_FILE
          value: {{ .Values.workload.configPath }}/{{ .Values.workload.configFile }}
        {{- if eq .Values.volumes.useGcs true }}
        - name: MODEL_PATH
          value: {{ .Values.workload.modelPath | default (printf "%s/%s" .Values.volumes.gcsMounts.mountPath .Values.workload.model) }}
        {{- end }}
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        {{- if .Values.dynamo.prefillWorker.envs }}
        {{- toYaml .Values.dynamo.prefillWorker.envs | nindent 8 }}
        {{- end }}
      extraPodMetadata:
        annotations:
          {{- if eq .Values.volumes.useGcs true }}
          gke-gcsfuse/cpu-limit: "0"
          gke-gcsfuse/ephemeral-storage-limit: "0"
          gke-gcsfuse/memory-limit: "0"
          gke-gcsfuse/volumes: "true"
          {{- end }}
      extraPodSpec:
        {{- if not (.Values.dynamo.rdma).claimTemplateName }}
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        {{- end }}
        automountServiceAccountToken: true
        {{- if .Values.dynamo.serviceAccountName }}
        serviceAccountName: {{ .Values.dynamo.serviceAccountName }}
        {{- end }}
        resourceClaims:
          - name: compute-domain-channel
            resourceClaimTemplateName: {{ .Values.dynamo.computeDomain.resourceClaimTemplateName }}
          {{- if (.Values.dynamo.rdma).claimTemplateName }}
          - name: rdma
            resourceClaimTemplateName: {{ .Values.dynamo.rdma.claimTemplateName }}
          {{- end }}
        tolerations:
          - key: "kubernetes.io/arch"
            operator: "Equal"
            value: "arm64"
            effect: "NoSchedule"
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                  - arm64
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: nvidia.com/dynamo-component-type
                        operator: In
                        values: ["worker"]
                  topologyKey: cloud.google.com/gce-topology-subblock
        nodeSelector:
          cloud.google.com/gke-accelerator: nvidia-gb300
          cloud.google.com/gke-gpu: "true"
          kubernetes.io/arch: arm64
          {{- with .Values.dynamo.nodeSelector }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        mainContainer:
          securityContext:
            privileged: true
            runAsUser: 0
            capabilities:
              add: ["IPC_LOCK"]
          stdin: true
          tty: true
          image: {{ .Values.workload.image }}
          workingDir: /tmp
          startupProbe:
            failureThreshold: {{ .Values.dynamo.prefillWorker.startupProbe.failureThreshold }}
            httpGet:
              path: /live
              port: system
            periodSeconds: {{ .Values.dynamo.prefillWorker.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.dynamo.prefillWorker.startupProbe.timeoutSeconds }}
            initialDelaySeconds: {{ .Values.dynamo.prefillWorker.startupProbe.initialDelaySeconds }}
          command: ["/bin/bash", "-c"]
          args:
          - |
            set -e
            echo "precedence ::ffff:0:0/96  100" >> /etc/gai.conf 2>/dev/null || true
            nvidia-smi
            export TRITON_PTXAS_PATH=/usr/local/cuda/bin/ptxas
            echo "Using ptxas: $TRITON_PTXAS_PATH"
            [ -f /usr/local/gib/scripts/set_nccl_env.sh ] && . /usr/local/gib/scripts/set_nccl_env.sh || true
            export NCCL_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME:-eth0}
            export NCCL_IB_DISABLE=${NCCL_IB_DISABLE:-1}
            export NCCL_CROSS_NIC=${NCCL_CROSS_NIC:-1}
            export NCCL_NET_GDR_LEVEL=${NCCL_NET_GDR_LEVEL:-PIX}
            export GLOO_SOCKET_IFNAME=${GLOO_SOCKET_IFNAME:-eth0}
            export TP_SOCKET_IFNAME=${TP_SOCKET_IFNAME:-eth0}
            export NCCL_DEBUG=${NCCL_DEBUG:-INFO}
            export SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE=${SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE:-100000}
            export SGLANG_DISAGGREGATION_HEARTBEAT_INTERVAL=${SGLANG_DISAGGREGATION_HEARTBEAT_INTERVAL:-10.0}
            export SGLANG_DISAGGREGATION_QUEUE_SIZE=${SGLANG_DISAGGREGATION_QUEUE_SIZE:-1024}
            export SGLANG_DISAGGREGATION_THREAD_POOL_SIZE=${SGLANG_DISAGGREGATION_THREAD_POOL_SIZE:-1024}
            export SGLANG_MOONCAKE_CUSTOM_MEM_POOL=${SGLANG_MOONCAKE_CUSTOM_MEM_POOL:-NVLINK}
            export MOONCAKE_PROTOCOL=${MOONCAKE_PROTOCOL:-tcp}
            if [ "${MC_FORCE_MNNVL:-}" = "0" ] || [ "${MC_FORCE_MNNVL:-}" = "false" ]; then
              unset MC_FORCE_MNNVL
            fi

            echo "--- VERIFYING NCCL ENV VARS IN SHELL ---"
            env | grep NCCL_
            echo "--- END VERIFICATION ---"
            pip install hf_transfer --break-system-packages || true
            # Repro fix: SGLang f7473673dd replaced ServerArgs.get_model_config()
            # with sglang.srt.server_args.model_config_of(); ai-dynamo 1.5.1 still
            # calls the old method. Patch only when the old method is missing.
