                if [ -n "$key" ]; then
                  if [[ "$value" == "true" ]]; then
                    ARGS+=("--$key")
                  elif [[ "$value" == "false" ]]; then
                    :
                  elif [ -n "$value" ]; then
                    if [[ "$value" =~ ^\[.*\]$ ]]; then
                      clean_value=$(echo "$value" | tr -d '[],')
                      ARGS+=("--$key")
                      for val in $clean_value; do
                        ARGS+=("$val")
                      done
                    else
