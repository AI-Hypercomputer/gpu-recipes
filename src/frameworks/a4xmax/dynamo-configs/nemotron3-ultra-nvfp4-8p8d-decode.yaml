# Nemotron-3-Ultra 550B NVFP4, disaggregated 8P8D on A4X-MAX: DECODE worker (TP4/EP4, one per GB300 node).
served-model-name: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
host: "0.0.0.0"
port: "9090"
skip-tokenizer-init: true
trust-remote-code: true
enable-metrics: true
tp-size: "4"
ep-size: "4"
quantization: "modelopt_fp4"
mem-fraction-static: "0.85"
context-length: "262144"
page-size: "64"
watchdog-timeout: "1000000"
event-plane: "zmq"
request-plane: "tcp"
kv-events-config: '{"publisher":"zmq","endpoint":"tcp://*:5557","replay_endpoint":"tcp://*:5558"}'
disaggregation-mode: decode
disaggregation-transfer-backend: "mooncake"
disaggregation-bootstrap-port: "30001"
max-running-requests: "64"
