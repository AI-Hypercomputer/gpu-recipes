# DeepSeek-V4-Pro (MXFP4) + EAGLE MTP | point p1 (Low latency) | srt-slurm recipe `disagg-low-latency-1p1d-tp4-tp4-mtp` | DECODE worker
#
# Each `key: value` line becomes `--key value` on the dynamo.sglang command line;
# `key: true` becomes a bare `--key` flag. Multi-node rendezvous flags
# (--dist-init-addr/--nnodes/--node-rank) and --model-path are injected by the
# Dynamo operator and the Helm chart launcher, so they are not listed here.

served-model-name: "deepseek-ai/DeepSeek-V4-Pro"
disaggregation-mode: "decode"
disaggregation-transfer-backend: "mooncake"
disaggregation-bootstrap-port: "30001"
host: "0.0.0.0"
port: "9090"
trust-remote-code: true
tool-call-parser: "deepseekv4"
tensor-parallel-size: "4"
data-parallel-size: "1"
expert-parallel-size: "1"
moe-runner-backend: "flashinfer_mxfp4"
disable-flashinfer-autotune: true
speculative-algo: "EAGLE"
speculative-num-steps: "3"
speculative-eagle-topk: "1"
speculative-num-draft-tokens: "4"
mem-fraction-static: "0.9"
max-running-requests: "8"
cuda-graph-max-bs: "8"
swa-full-tokens-ratio: "0.1"
context-length: "16384"
