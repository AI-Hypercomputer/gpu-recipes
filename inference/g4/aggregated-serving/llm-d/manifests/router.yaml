apiVersion: apps/v1
kind: Deployment
metadata:
  name: "llmd-inference-router"
  labels:
    app.kubernetes.io/name: llm-d-inference
    app.kubernetes.io/instance: "llmd-inference"
    app.kubernetes.io/component: router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-d-inference
      app.kubernetes.io/instance: "llmd-inference"
      app.kubernetes.io/component: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d-inference
        app.kubernetes.io/instance: "llmd-inference"
        app.kubernetes.io/component: router
    spec:
      automountServiceAccountToken: true
      serviceAccountName: default
      containers:
      - name: envoy-proxy
        image: docker.io/envoyproxy/envoy:distroless-v1.33.2
        imagePullPolicy: IfNotPresent
        command: ["envoy"]
        args:
        - "--service-node"
        - "envoy-proxy"
        - "--log-level"
        - "warn"
        - "-c"
        - "/etc/envoy/envoy.yaml"
        ports:
        - name: http-8081
          containerPort: 8081
          protocol: TCP
        - name: ready-19001
          containerPort: 19001
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /ready
            port: 19001
            scheme: HTTP
          periodSeconds: 5
          timeoutSeconds: 1
        resources:
          limits:
            cpu: "8"
            memory: 16Gi
          requests:
            cpu: "2"
            memory: 4Gi
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
          readOnly: true
      - name: router
        image: ghcr.io/llm-d/llm-d-router-endpoint-picker:main
        imagePullPolicy: IfNotPresent
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        ports:
        - name: grpc
          containerPort: 9002
          protocol: TCP
        - name: grpc-health
          containerPort: 9003
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        args:
        - "--endpoint-selector=app.kubernetes.io/instance=llmd-inference,app.kubernetes.io/name=llm-d-inference,app.kubernetes.io/component=model-server"
        - "--endpoint-target-ports=8000"
        - "--config-file=/etc/epp/plugins-config.yaml"
        - "--grpc-health-port=9003"
        - "--tracing=false"
        - "--metrics-endpoint-auth=false"
        - "--allow-experimental-plugins=true"
        readinessProbe:
          grpc:
            port: 9003
            service: inference-extension
          periodSeconds: 5
          timeoutSeconds: 1
        resources:
          limits:
            cpu: "8"
            memory: 16Gi
          requests:
            cpu: "2"
            memory: 4Gi
        volumeMounts:
        - name: epp-config
          mountPath: /etc/epp
          readOnly: true
      volumes:
      - name: envoy-config
        configMap:
          name: "llmd-inference-envoy-config"
      - name: epp-config
        configMap:
          name: "llmd-inference-epp-config"
