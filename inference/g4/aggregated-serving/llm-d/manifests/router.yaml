apiVersion: v1
kind: Service
metadata:
  name: "llmd-inference-frontend"
  labels:
    app.kubernetes.io/name: llm-d-inference
    app.kubernetes.io/instance: "llmd-inference"
    app.kubernetes.io/component: router
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: llm-d-inference
    app.kubernetes.io/instance: "llmd-inference"
    app.kubernetes.io/component: router
  ports:
  - name: http
    port: 80
    targetPort: 8081
  - name: http-openai
    port: 8000
    targetPort: 8081
  - name: grpc-ext-proc
    port: 9002
    targetPort: 9002
  - name: epp-metrics
    port: 9090
    targetPort: 9090
