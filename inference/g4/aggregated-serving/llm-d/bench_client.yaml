apiVersion: v1
kind: Pod
metadata:
  name: bench-client
  labels:
    app: bench-client
spec:
  restartPolicy: Never
  containers:
  - name: benchmark
    image: python:3.10
    workingDir: /workspace
    command: ["/bin/bash", "-c"]
    # This script runs ONCE when the pod starts to set everything up.
    # Then it sleeps forever so the pod stays open for you.
    args:
    - |
      echo "--- STARTING SETUP ---"

      # 1. Install System Dependencies
      apt-get update && apt-get install -y git curl jq

      # 2. Install Python Dependencies (including AIPerf for AgentX profiling and synthetic benchmark deps)
      pip install -q --upgrade pip
      pip install -q aiperf transformers aiohttp numpy requests tqdm pandas datasets Pillow huggingface_hub hf_transfer

      # 3. Create Artifact Directory for AIPerf Profiling Outputs
      mkdir -p /logs/agentic/aiperf_artifacts

      echo "--- SETUP COMPLETE. POD IS READY. ---"

      # 4. Keep the pod alive indefinitely
      sleep infinity
    env:
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: hf-token-secret
          key: HF_TOKEN
          optional: true
    - name: HF_HUB_ENABLE_HF_TRANSFER
      value: "1"
    volumeMounts:
    - mountPath: /logs
      name: logs-volume
  volumes:
  - name: logs-volume
    emptyDir: {}
