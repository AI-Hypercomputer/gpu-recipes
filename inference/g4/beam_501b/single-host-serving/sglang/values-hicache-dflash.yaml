workload:
  name: reflection-beam-nvfp4-g4-hicache
  image: lmsysorg/sglang:beam@sha256:0ea912aadc3d7827858de9aa5a312c4d51c254e7dbe670dbbe8181895b92071d
  imagePullPolicy: IfNotPresent
  modelPath: reflection/Beam-1.0-501B-A23B-NVFP4
  drafterPath: reflection/Beam-1.0-501B-A23B-DFlash2

  envs:
    - name: HF_HOME
      value: /ssd
    - name: SGLANG_SET_CPU_AFFINITY
      value: "1"
    - name: OMP_NUM_THREADS
      value: "24"
    - name: NCCL_P2P_LEVEL
      value: "SYS"
    - name: NCCL_MIN_NCHANNELS
      value: "8"
    - name: NCCL_DEBUG
      value: "WARN"
    - name: SGLANG_FLASHINFER_AUTOTUNE_EXTEND
      value: "1"

  resources:
      requests:
        cpu: "96"
        memory: 1Ti
        nvidia.com/gpu: "8"
      limits:
        nvidia.com/gpu: "8"

targetNodes: []

service:
  port: 30080

volumes:
  # 500Gi pod-scoped download volume for HF_HOME; deleted with the pod.
  ssdMountPath: /ssd
  ephemeralScratchSize: 500Gi
  ephemeralStorageClass: dynamic-rwo
  # Separate from caches written by other SGLang builds.
  hostCachePath: /var/lib/sglang-cache/lmsysorg-sglang-beam
  shmSize: 32Gi
