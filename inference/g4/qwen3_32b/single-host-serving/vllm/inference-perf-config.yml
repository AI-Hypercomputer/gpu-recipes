# inference-perf benchmark config for Qwen3-32B (NVFP4) on G4 with vLLM.
# High-throughput operating point: concurrency 2000, 4000 requests, ISL/OSL 1024/1024.
load:
  type: concurrent
  stages:
    - concurrency_level: 2000
      num_requests: 4000
api:
  type: completion
  streaming: true
server:
  type: vllm
  model_name: RedHatAI/Qwen3-32B-NVFP4
  base_url: http://0.0.0.0:8000
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: RedHatAI/Qwen3-32B-NVFP4
data:
  type: random
  input_distribution:
    min: 1024
    max: 1024
    mean: 1024
    std_dev: 0
    total_count: 4000
  output_distribution:
    min: 1024
    max: 1024
    mean: 1024
    std_dev: 0
    total_count: 4000
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: false
