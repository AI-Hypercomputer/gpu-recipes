apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
- type: metrics-data-source
  parameters:
    scheme: http
    path: /metrics
    insecureSkipVerify: true
- type: core-metrics-extractor
  parameters:
    engineConfigs:
    - name: vllm
      queuedRequestsSpec: vllm:num_requests_waiting
      runningRequestsSpec: vllm:num_requests_running
      kvUsageSpec: vllm:kv_cache_usage_perc
      loraSpec: ''
      cacheInfoSpec: ''
# Send every request down the disaggregated P/D path.
- type: always-disagg-pd-decider
- type: disagg-profile-handler
  parameters:
    deciders:
      prefill: always-disagg-pd-decider
# Split the endpoints on the llm-d.ai/role label.
- type: prefill-filter
- type: decode-filter
# Tokenize incoming chat completions via the prefill render servers on :8089.
- type: token-producer
  parameters:
    modelName: {{ .Values.model }}
    vllm:
      url: "http://{{ .Release.Name }}-model-server-svc:8089"
      timeout: 60s
      mmTimeout: 60s
- type: endpoint-notification-source
# Track real-time GPU and Mooncake DRAM KV-cache block placement via ZMQ KV events (:5557).
# `blockSizeTokens: 2048` matches `--block-size=2048` on the TP=8 prefill engines
# (Kimi-K3.1-Pro's hybrid MLA + KDA cache page alignment).
- type: precise-prefix-cache-producer
  parameters:
    tokenProcessorConfig:
      blockSizeTokens: 2048
      hashSeed: "42"
    speculativeIndexing: true
    speculativeTTL: 30s
    indexerConfig:
      kvBlockIndexConfig:
        enableMetrics: true
        inMemoryConfig:
          size: 100000000
          podCacheSize: 128
      kvCacheBackendConfigs:
      - name: gpu
        weight: 1.0
      - name: cpu
        weight: 0.9
    kvEventsConfig:
      topicFilter: "kv@"
      concurrency: 16
      engineType: vllm
      discoverPods: true
      podDiscoveryConfig:
        podNamespace: {{ .Release.Namespace }}
        podLabelSelector: "app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/name=llm-d-model-server,llm-d.ai/role=prefill"
        socketPort: 5557
- type: approx-prefix-cache-producer
  parameters:
    autoTune: false
    blockSizeTokens: 128
    maxPrefixTokensToMatch: 128
    maxPrefixBlocksToMatch: 1
    lruCapacityPerServer: 1
- type: inflight-load-producer
  parameters:
    prefixMatchInfoProducerName: precise-prefix-cache-producer
    addEstimatedOutputTokens: false
    syncCrossReplicaState: false
- type: prefix-cache-scorer
  parameters:
    prefixMatchInfoProducerName: precise-prefix-cache-producer
- type: session-affinity-scorer
  parameters:
    profileName: prefill
    strategy: session_id
    sessionIdConfig:
      sources:
      - header: x-session-id
      evictionTtlSeconds: 3600
      evictionSweepSeconds: 10
- type: active-request-scorer
  parameters:
    idleThreshold: 0
    inFlightLoadProducerName: inflight-load-producer
- type: token-load-scorer
  parameters:
    queueThresholdTokens: 6000000
    inFlightLoadProducerName: inflight-load-producer
- type: no-hit-lru-scorer
  parameters:
    prefixMatchInfoProducerName: precise-prefix-cache-producer
    lruSize: 4096
- type: queue-scorer
- type: kv-cache-utilization-scorer
- type: max-score-picker
- type: utilization-detector
  parameters:
    queueDepthThreshold: 100000
    kvCacheUtilThreshold: 1.0
    headroom: 1.0
    metricsStalenessThreshold: 3600s
dataLayer:
  injectDefaults: false
  sources:
  - pluginRef: metrics-data-source
    extractors:
    - pluginRef: core-metrics-extractor
  - pluginRef: endpoint-notification-source
    extractors:
    - pluginRef: precise-prefix-cache-producer
flowControl:
  saturationDetector:
    pluginRef: utilization-detector
schedulingProfiles:
- name: prefill
  plugins:
  - pluginRef: prefill-filter
  - pluginRef: utilization-detector
  - pluginRef: prefix-cache-scorer
    weight: 16
  - pluginRef: session-affinity-scorer
    weight: 12
  - pluginRef: active-request-scorer
    weight: 4
  - pluginRef: token-load-scorer
    weight: 4
  - pluginRef: no-hit-lru-scorer
    weight: 2
  - pluginRef: max-score-picker
- name: decode
  plugins:
  - pluginRef: decode-filter
  - pluginRef: utilization-detector
  - pluginRef: active-request-scorer
    weight: 5
  - pluginRef: queue-scorer
    weight: 3
  - pluginRef: kv-cache-utilization-scorer
    weight: 3
  - pluginRef: max-score-picker
