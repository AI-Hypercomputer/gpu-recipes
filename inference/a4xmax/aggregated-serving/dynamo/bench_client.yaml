apiVersion: v1
kind: Pod
metadata:
  name: bench-client
  labels:
    app: bench-client
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/arch: arm64
  tolerations:
  - key: "kubernetes.io/arch"
    operator: "Equal"
    value: "arm64"
    effect: "NoSchedule"
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"
  containers:
  - name: benchmark
    image: python:3.12
    workingDir: /workspace
    command: ["/bin/bash", "-c"]
    # This script runs ONCE when the pod starts to set everything up.
    # Then it sleeps forever so the pod stays open for you.
    args:
    - |
      echo "--- STARTING SETUP ---"

      # 1. Install System Dependencies
      apt-get update && apt-get install -y git curl jq

      # 2. Install Python Dependencies. AgentX profiling needs `--warmup-requests-per-lane`,
      # which is not in the aiperf 0.13.0 PyPI release, so install aiperf from a pinned commit.
      pip install -q --upgrade pip
      pip install -q "aiperf @ git+https://github.com/ai-dynamo/aiperf.git@1dfaea5fef059d32b7198b3da5325ae415be80c9"
      pip install -q transformers aiohttp numpy requests tqdm pandas datasets Pillow huggingface_hub hf_transfer

      # 3. Create Artifact Directory for AIPerf Profiling Outputs
      mkdir -p /logs/agentic/aiperf_artifacts

      echo "--- SETUP COMPLETE. POD IS READY. ---"

      # 4. Keep the pod alive indefinitely
      sleep infinity
    env:
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: hf-token-secret
          key: HF_TOKEN
          optional: true
    - name: HF_HUB_ENABLE_HF_TRANSFER
      value: "1"
    - name: AIPERF_DATASET_CONFIGURATION_TIMEOUT
      value: "1800"
    - name: AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT
      value: "1800"
    resources:
      requests:
        cpu: "4"
        memory: "20Gi"
      limits:
        memory: "300Gi"
