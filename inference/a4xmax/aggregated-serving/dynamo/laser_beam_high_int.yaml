dynamo:
  namespace: dynamo-cloud
  releaseVersion: "1.0.1"
  deploymentName: dynamo-agg8w-dflash
  computeDomain:
    name: a4x-max-domain
    numNodes: 8
    resourceClaimTemplateName: a4x-max-compute-domain-channel
  rdma:
    claimTemplateName:
  serviceAccountName:
  frontend:
    image: us-central1-docker.pkg.dev/supercomputer-testing/pirillo-gcr/sglang-beam:dev-cu13-d4be2f8c-arm64
    replicas: 1
    envs:
      - name: DYN_DISCOVERY_BACKEND
        value: kubernetes
      - name: DYN_EVENT_PLANE
        value: zmq
      - name: DYN_REQUEST_PLANE
        value: tcp
      - name: POD_UID
        valueFrom:
          fieldRef:
            fieldPath: metadata.uid
      - name: DYN_ROUTER_MODE
        value: kv
      - name: DYN_CHAT_PROCESSOR
        value: sglang
      - name: DYN_KV_CACHE_BLOCK_SIZE
        value: "64"
    livenessProbe:
      initialDelaySeconds: 10
      periodSeconds: 60
      timeoutSeconds: 150
      failureThreshold: 100
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 60
      timeoutSeconds: 300
      failureThreshold: 100
  decodeWorker:
    nodeCount: 1
    replicas: 8
    envs:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: hf-token-secret
            key: HF_TOKEN
      - name: HF_HUB_ENABLE_HF_TRANSFER
        value: "1"
      - name: LD_LIBRARY_PATH
        value: "/usr/local/ucx/lib:/usr/local/ucx/lib/ucx:/opt/nvidia/nvda_nixl/lib/aarch64-linux-gnu:/opt/nvidia/nvda_nixl/lib/aarch64-linux-gnu/plugins:/usr/local/nvidia/lib64"
      - name: UCX_TLS
        value: "cuda_copy,cuda_ipc,tcp"
      - name: UCX_CUDA_IPC_ENABLE_MNNVL
        value: "true"
      - name: UCX_CUDA_COPY_DMABUF
        value: "true"
      - name: UCX_MEMTYPE_CACHE
        value: "false"
      - name: UCX_IB_PCI_RELAXED_ORDERING
        value: "true"
      - name: UCX_NET_DEVICES
        value: "eth0"
      - name: UCX_IB_GID_INDEX
        value: "3"
      - name: UCX_LOG_LEVEL
        value: "info"
      - name: NIXL_NUM_TRANSPORT_THREADS
        value: "4"
      - name: GLOO_SOCKET_IFNAME
        value: eth0
      - name: TP_SOCKET_IFNAME
        value: eth0
      - name: PYTHONUNBUFFERED
        value: "1"
      - name: DYN_SKIP_SGLANG_LOG_FORMATTING
        value: "1"
      - name: DYN_DISCOVERY_BACKEND
        value: kubernetes
      - name: DYN_EVENT_PLANE
        value: zmq
      - name: DYN_REQUEST_PLANE
        value: tcp
      - name: TORCH_DISTRIBUTED_DEFAULT_TIMEOUT
        value: "1800"
      - name: TORCH_CUDA_ARCH_LIST
        value: "10.3a"
      - name: PYTORCH_ALLOC_CONF
        value: "expandable_segments:True"
      - name: PYTORCH_CUDA_ALLOC_CONF
        value: "expandable_segments:True"
      - name: SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN
        value: "1"
      - name: SGLANG_MOE_NVFP4_DISPATCH
        value: "1"
      - name: SGLANG_NVFP4_CKPT_FP8_GEMM_IN_ATTN
        value: "1"
      - name: SGLANG_PER_TOKEN_GROUP_QUANT_8BIT_V2
        value: "1"
      - name: SGLANG_ENABLE_JIT_DEEPGEMM
        value: "false"
      - name: SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK
        value: "1024"
      - name: SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE
        value: "100000"
      - name: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
        value: "100000"
      - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
        value: "100000"
      - name: SGLANG_DECODE_BOOTSTRAP_TIMEOUT
        value: "100000"
      - name: SGLANG_HACK_SEQ_BOOTSTRAP_ROOM
        value: "1"
      - name: SGLANG_MOONCAKE_CUSTOM_MEM_POOL
        value: "NVLINK"
      - name: SGLANG_USE_MESSAGE_QUEUE_BROADCASTER
        value: "0"
      - name: SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK
        value: "1"
      - name: SGLANG_DISABLE_CUSTOM_ALL_REDUCE
        value: "0"
      - name: MOONCAKE_PROTOCOL
        value: "tcp"
      - name: MC_TE_METRIC
        value: "true"
      - name: MC_FORCE_MNNVL
        value: "1"
      - name: NCCL_DEBUG
        value: "INFO"
      - name: NCCL_IB_DISABLE
        value: "1"
      - name: NCCL_NET
        value: "Socket"
      - name: NCCL_SOCKET_IFNAME
        value: "eth0"
      - name: NCCL_CROSS_NIC
        value: "1"
      - name: NCCL_MNNVL_ENABLE
        value: "1"
      - name: NCCL_CUMEM_ENABLE
        value: "1"
      - name: NCCL_VMM_ENABLE
        value: "1"
      - name: NCCL_NVLS_ENABLE
        value: "1"
      - name: NCCL_NET_GDR_C2C
        value: "1"
      - name: NCCL_NET_GDR_LEVEL
        value: "PIX"
    livenessProbe:
      initialDelaySeconds: 10
      periodSeconds: 60
      timeoutSeconds: 30
      failureThreshold: 60
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 60
      timeoutSeconds: 30
      failureThreshold: 60
    startupProbe:
      initialDelaySeconds: 10
      periodSeconds: 60
      timeoutSeconds: 30
      failureThreshold: 1800
  prefillWorker:
    nodeCount: 1
    replicas: 0
    envs: []
    livenessProbe:
      initialDelaySeconds: 10
      periodSeconds: 60
      timeoutSeconds: 30
      failureThreshold: 60
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 60
      timeoutSeconds: 30
      failureThreshold: 60
    startupProbe:
      initialDelaySeconds: 10
      periodSeconds: 60
      timeoutSeconds: 30
      failureThreshold: 1800

secrets:
  ngc:
    secretName: nvcr-secret
  huggingface:
    secretName: hf-token-secret
    secretData:
      token: "hf_api_token"

volumes:
  useGcs: true
  gcsfuse:
    bucketName:
  ssdMountPath: "/ssd"
  gcsMounts:
    mountPath: "/data/model"

service:
  type: ClusterIP
  ports:
    frontend: 8000
    worker: 9090

workload:
  model: reflection/Beam-1.0-501B-A23B-NVFP4
  image: us-central1-docker.pkg.dev/supercomputer-testing/pirillo-gcr/sglang-beam:dev-cu13-d4be2f8c-arm64
  framework: sglang
  configFile: serving-args.yaml
  configPath: /workload/configs

network:
  subnetworks: []
  gibVersion: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib-diagnostic-arm64:v1.0.7
  ncclSettings:
    - name: NCCL_DEBUG
      value: "VERSION"

quantizations:
  - "nvfp4"
