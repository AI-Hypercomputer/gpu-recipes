workload:
  model: moonshotai/Kimi-K3
  servedModelName: moonshotai/Kimi-K3
  modelPath: /data/model/huggingface_model_cache/models--moonshotai--Kimi-K3
  image: lmsysorg/sglang:kimi-k3
  framework: sglang
  nnodes: 4
  tpSize: 16
  serviceAccountName: workload-identity-k8s-sa
  extraPipPackages: "hf_transfer fla-core google-cloud-storage"
  extraEnv:
  - name: HF_HOME
    value: "/gcs-cache/hf_cache"
  - name: TMPDIR
    value: "/gcs-cache/tmp"
  - name: RUNAI_STREAMER_MEMORY_LIMIT
    value: "34359738368"
  - name: RUNAI_STREAMER_CONCURRENCY
    value: "16"
  - name: PYTORCH_CUDA_ALLOC_CONF
    value: "expandable_segments:True"
  - name: TORCH_NCCL_ENABLE_MONITORING
    value: "0"
  - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
    value: "0"
  - name: TORCH_DISTRIBUTED_TIMEOUT
    value: "3600"
  - name: TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC
    value: "0"
  extraArgs: |
    --dist-timeout 3600 \
    --trust-remote-code \
    --reasoning-parser kimi_k3 \
    --tool-call-parser kimi_k3 \
    --mamba-full-memory-ratio 7.21 \
    --dcp-size 16 \
    --mem-fraction-static 0.85 \
    --speculative-algorithm DSPARK \
    --speculative-draft-model-path RadixArk/Kimi-K3-DSpark \
    --speculative-dspark-block-size 7

volumes:
  gcsfuse:
    bucketName: <YOUR_GCS_BUCKET>
